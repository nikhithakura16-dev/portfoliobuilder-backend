spring.application.name=student-portfolio-api
spring.config.import=optional:file:./local-secrets.properties
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_portfolio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-this-key-before-deployment-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
